name: Studio tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/reliability-maintenance]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Studio, alle zelfstandige templates en JavaScript testen
        run: python -B run_tests.py
      - name: Alleen-lezen onderhoudscontrole
        run: python -B studio.py maintenance --format json
