name: Python-tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Haal de projectbestanden op
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Stel Python in
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Voer de tests uit
        run: python -m unittest discover -s tests -v
