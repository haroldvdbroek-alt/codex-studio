name: Web-tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: JavaScript-tests
        run: node --test tests/counter.test.cjs
      - name: HTML- en bestandscontroles
        run: python -m unittest discover -s tests -v
